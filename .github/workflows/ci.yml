name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out image repository
        uses: actions/checkout@v4

      - name: Check out upstream imapsync
        uses: actions/checkout@v4
        with:
          repository: imapsync/imapsync
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: imapsync:test
          build-args: |
            IMAPSYNC_VERSION=ci
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Smoke test image
        run: docker run --rm imapsync:test --version

      - name: Smoke test argument file configuration
        run: |
          printf '%s\n' --version > imapsync.args
          docker run --rm \
            --mount type=bind,source="$PWD/imapsync.args",target=/config/imapsync.args,readonly \
            -e IMAPSYNC_ARGS_FILE=/config/imapsync.args \
            imapsync:test

      - name: Check missing argument file error
        run: |
          docker run --rm imapsync:test >/tmp/imapsync-entrypoint.out 2>&1 && exit 1 || true
          grep -F 'IMAPSYNC_ARGS_FILE is required when no command is supplied.' /tmp/imapsync-entrypoint.out